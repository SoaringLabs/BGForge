# Generated by Plane DevFlow. No PR checkout or PR code execution.
name: Plane task sync
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: plane-devflow-${{ github.event.pull_request.number || 'connection-check' }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SoaringLabs/plane-devflow@b49ad23ed31a80e5263f0f66b56fd1bef1a7d8cb # Plane DevFlow 0.15.1
        with:
          github-token: ${{ github.token }}
          plane-api-key: ${{ secrets.PLANE_API_KEY }}
          trusted-config-sha: ${{ github.sha }}
